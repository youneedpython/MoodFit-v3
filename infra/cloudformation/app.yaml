AWSTemplateFormatVersion: "2010-09-09"
Description: "MoodFit private Fargate application and CloudFront-protected HTTPS ALB"
Parameters:
  Environment:
    Type: "String"
    Default: "staging"
    AllowedValues: ["staging", "production"]
  Owner:
    Type: "String"
  VpcId:
    Type: "AWS::EC2::VPC::Id"
  PublicSubnetA:
    Type: "AWS::EC2::Subnet::Id"
  PublicSubnetB:
    Type: "AWS::EC2::Subnet::Id"
  AppSubnetA:
    Type: "AWS::EC2::Subnet::Id"
  AppSubnetB:
    Type: "AWS::EC2::Subnet::Id"
  AlbSecurityGroupId:
    Type: "AWS::EC2::SecurityGroup::Id"
  AppSecurityGroupId:
    Type: "AWS::EC2::SecurityGroup::Id"
  HostedZoneId:
    Type: "String"
  OriginHostname:
    Type: "String"
    Default: "origin.staging.moodfit.8949db.kr"
  OriginVerificationValue:
    Type: "String"
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: "[A-Za-z0-9_-]+"
    Description: "Human supplies the same private value to app and frontend; never output it"
  BackendImage:
    Type: "String"
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}'
    Description: "Verified linux/amd64 immutable ECR image by digest"
  ExecutionRoleArn:
    Type: "String"
  TaskRoleArn:
    Type: "String"
  ApplicationLogGroupName:
    Type: "String"
    Description: "Existing IAM stack log group with 30-day retention; no duplicate ownership"
  DatabaseEndpoint:
    Type: "String"
  DatabaseName:
    Type: "String"
    Default: "moodfit"
    AllowedPattern: "[A-Za-z][A-Za-z0-9_]*"
  DbCredentialArn:
    Type: "String"
    Description: "Data stack AppDbCredentialArn output; full generated resource ARN"
  DesiredCount:
    Type: "Number"
    Default: 2
    AllowedValues: [2]
    Description: "Approved two-task capacity; expansion requires a new cost Gate"
  TaskCpu:
    Type: "String"
    Default: "512"
    AllowedValues: ["512"]
  TaskMemory:
    Type: "String"
    Default: "1024"
    AllowedValues: ["1024"]
Resources:
  AccessLogBucket:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: "Retain"
    UpdateReplacePolicy: "Retain"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: "AES256"}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: "BucketOwnerEnforced"}]
      LifecycleConfiguration:
        Rules:
          - Id: "ExpireAccessLogs"
            Status: "Enabled"
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
      Tags:
        - {Key: "Project", Value: "MoodFit"}
        - {Key: "Environment", Value: !Ref Environment}
        - {Key: "Owner", Value: !Ref Owner}
  AccessLogBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket: !Ref AccessLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal: {Service: "logdelivery.elasticloadbalancing.amazonaws.com"}
            Action: "s3:PutObject"
            Resource: !Sub "${AccessLogBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/*"
          - Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt AccessLogBucket.Arn, !Sub "${AccessLogBucket.Arn}/*"]
            Condition:
              Bool: {aws:SecureTransport: "false"}
  OriginCertificate:
    Type: "AWS::CertificateManager::Certificate"
    Properties:
      DomainName: !Ref OriginHostname
      ValidationMethod: "DNS"
      DomainValidationOptions:
        - DomainName: !Ref OriginHostname
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - {Key: "Project", Value: "MoodFit"}
        - {Key: "Environment", Value: !Ref Environment}
        - {Key: "Owner", Value: !Ref Owner}
  LoadBalancer:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    DependsOn: "AccessLogBucketPolicy"
    Properties:
      Type: "application"
      Scheme: "internet-facing"
      IpAddressType: "ipv4"
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroupId]
      LoadBalancerAttributes:
        - {Key: "access_logs.s3.enabled", Value: "true"}
        - {Key: "access_logs.s3.bucket", Value: !Ref AccessLogBucket}
        - {Key: "access_logs.s3.prefix", Value: "alb"}
        - {Key: "routing.http.drop_invalid_header_fields.enabled", Value: "true"}
      Tags:
        - {Key: "Project", Value: "MoodFit"}
        - {Key: "Environment", Value: !Ref Environment}
        - {Key: "Owner", Value: !Ref Owner}
  OriginDns:
    Type: "AWS::Route53::RecordSet"
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref OriginHostname
      Type: "A"
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false
  TargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      VpcId: !Ref VpcId
      Protocol: "HTTP"
      Port: 8080
      TargetType: "ip"
      HealthCheckProtocol: "HTTP"
      HealthCheckPort: "traffic-port"
      HealthCheckPath: "/actuator/health/readiness"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes:
        - {Key: "deregistration_delay.timeout_seconds", Value: "30"}
      Tags:
        - {Key: "Project", Value: "MoodFit"}
        - {Key: "Environment", Value: !Ref Environment}
        - {Key: "Owner", Value: !Ref Owner}
  HttpsListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: "HTTPS"
      Port: 443
      Certificates: [{CertificateArn: !Ref OriginCertificate}]
      SslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
      DefaultActions:
        - Type: "fixed-response"
          FixedResponseConfig: {StatusCode: "403", ContentType: "text/plain", MessageBody: "Forbidden"}
  OriginHeaderRule:
    Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: "http-header"
          HttpHeaderConfig:
            HttpHeaderName: "X-MoodFit-Origin"
            Values: [!Ref OriginVerificationValue]
      Actions: [{Type: "forward", TargetGroupArn: !Ref TargetGroup}]
  Cluster:
    Type: "AWS::ECS::Cluster"
    Properties:
      ClusterName: !Sub "moodfit-${Environment}"
      Tags:
        - {Key: "Project", Value: "MoodFit"}
        - {Key: "Environment", Value: !Ref Environment}
        - {Key: "Owner", Value: !Ref Owner}
  TaskDefinition:
    Type: "AWS::ECS::TaskDefinition"
    Properties:
      Family: !Sub "moodfit-${Environment}-backend"
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: "awsvpc"
      RequiresCompatibilities: ["FARGATE"]
      RuntimePlatform: {CpuArchitecture: "X86_64", OperatingSystemFamily: "LINUX"}
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: "backend"
          Image: !Ref BackendImage
          Essential: true
          User: "10001:10001"
          PortMappings: [{ContainerPort: 8080, Protocol: "tcp"}]
          Environment:
            - Name: "DB_URL"
              Value: !Sub "jdbc:mysql://${DatabaseEndpoint}:3306/${DatabaseName}?sslMode=REQUIRED"
          Secrets: [{Name: "DB_USERNAME", ValueFrom: !Sub "${DbCredentialArn}:username::"}, {Name: "DB_PASSWORD", ValueFrom: !Sub "${DbCredentialArn}:password::"}]
          HealthCheck:
            Command: ["CMD-SHELL", "curl --fail --silent --max-time 4 http://127.0.0.1:8080/actuator/health/liveness >/dev/null || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 120
          StopTimeout: 30
          LogConfiguration:
            LogDriver: "awslogs"
            Options:
              awslogs-group: !Ref ApplicationLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: "backend"
      Tags:
        - {Key: "Project", Value: "MoodFit"}
        - {Key: "Environment", Value: !Ref Environment}
        - {Key: "Owner", Value: !Ref Owner}
  Service:
    Type: "AWS::ECS::Service"
    DependsOn: "OriginHeaderRule"
    Properties:
      ServiceName: !Sub "moodfit-${Environment}-backend"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: "FARGATE"
      PlatformVersion: "1.4.0"
      DesiredCount: !Ref DesiredCount
      AvailabilityZoneRebalancing: "ENABLED"
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: "DISABLED"
          Subnets: [!Ref AppSubnetA, !Ref AppSubnetB]
          SecurityGroups: [!Ref AppSecurityGroupId]
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: "backend"
          ContainerPort: 8080
      PropagateTags: "SERVICE"
      EnableECSManagedTags: true
      Tags:
        - {Key: "Project", Value: "MoodFit"}
        - {Key: "Environment", Value: !Ref Environment}
        - {Key: "Owner", Value: !Ref Owner}
Outputs:
  OriginHostname:
    Value: !Ref OriginHostname
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ServiceArn:
    Value: !Ref Service
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  AccessLogBucketArn:
    Value: !GetAtt AccessLogBucket.Arn
