AWSTemplateFormatVersion: "2010-09-09"
Description: "MoodFit private static origin foundation; API origin is added in TASK-027"
Parameters:
  Environment:
    Type: "String"
    AllowedValues:
      - "staging"
      - "production"
    Default: "staging"
  Owner:
    Type: "String"
  HostedZoneId:
    Type: "String"
  ViewerHostname:
    Type: "String"
    Default: "staging.moodfit.8949db.kr"
  ViewerCertificateArn:
    Type: "String"
Resources:
  StaticBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          -
            ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          -
            ObjectOwnership: "BucketOwnerEnforced"
      VersioningConfiguration:
        Status: "Enabled"
      Tags:
        -
          Key: "Project"
          Value: "MoodFit"
        -
          Key: "Environment"
          Value:
            Ref: "Environment"
        -
          Key: "Owner"
          Value:
            Ref: "Owner"
    DeletionPolicy: "Retain"
    UpdateReplacePolicy: "Retain"
  OriginAccessControl:
    Type: "AWS::CloudFront::OriginAccessControl"
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: "${AWS::StackName}-oac"
        OriginAccessControlOriginType: "s3"
        SigningBehavior: "always"
        SigningProtocol: "sigv4"
  Distribution:
    Type: "AWS::CloudFront::Distribution"
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          -
            Ref: "ViewerHostname"
        DefaultRootObject: "index.html"
        HttpVersion: "http2and3"
        IPV6Enabled: true
        Origins:
          -
            Id: "static"
            DomainName:
              Fn::GetAtt:
                - "StaticBucket"
                - "RegionalDomainName"
            OriginAccessControlId:
              Ref: "OriginAccessControl"
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: "static"
          ViewerProtocolPolicy: "redirect-to-https"
          AllowedMethods:
            - "GET"
            - "HEAD"
            - "OPTIONS"
          CachedMethods:
            - "GET"
            - "HEAD"
          Compress: true
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
        ViewerCertificate:
          AcmCertificateArn:
            Ref: "ViewerCertificateArn"
          SslSupportMethod: "sni-only"
          MinimumProtocolVersion: "TLSv1.2_2021"
      Tags:
        -
          Key: "Project"
          Value: "MoodFit"
        -
          Key: "Environment"
          Value:
            Ref: "Environment"
        -
          Key: "Owner"
          Value:
            Ref: "Owner"
  StaticBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket:
        Ref: "StaticBucket"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "cloudfront.amazonaws.com"
            Action: "s3:GetObject"
            Resource:
              Fn::Sub: "${StaticBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub: "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          -
            Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource:
              -
                Fn::GetAtt:
                  - "StaticBucket"
                  - "Arn"
              -
                Fn::Sub: "${StaticBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  ViewerDns:
    Type: "AWS::Route53::RecordSet"
    Properties:
      HostedZoneId:
        Ref: "HostedZoneId"
      Name:
        Ref: "ViewerHostname"
      Type: "A"
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - "Distribution"
            - "DomainName"
        HostedZoneId: "Z2FDTNDATAQYW2"
        EvaluateTargetHealth: false
Outputs:
  StaticBucketArn:
    Value:
      Fn::GetAtt:
        - "StaticBucket"
        - "Arn"
  StaticObjectArn:
    Value:
      Fn::Sub: "${StaticBucket.Arn}/*"
  DistributionArn:
    Value:
      Fn::Sub: "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
