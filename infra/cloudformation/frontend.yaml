AWSTemplateFormatVersion: "2010-09-09"
Description: "MoodFit private static origin and uncached HTTPS application routing"
Parameters:
  Environment:
    Type: "String"
    AllowedValues:
      - "staging"
      - "production"
    Default: "staging"
  Owner:
    Type: "String"
  HostedZoneId:
    Type: "String"
  ViewerHostname:
    Type: "String"
    Default: "staging.moodfit.8949db.kr"
  ViewerCertificateArn:
    Type: "String"
  OriginHostname:
    Type: "String"
    Default: "origin.staging.moodfit.8949db.kr"
  OriginVerificationValue:
    Type: "String"
    NoEcho: true
    MinLength: 32
    MaxLength: 128
    AllowedPattern: "[A-Za-z0-9_-]+"
    Description: "Human supplies the same private value to app and frontend; never output it"
Resources:
  SpaRouting:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "moodfit-${Environment}-spa"
      AutoPublish: true
      FunctionConfig:
        Comment: "Rewrite known static SPA routes only; preserve API errors"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var spaRoutes = ['/check-in', '/history', '/login', '/privacy'];
          if (spaRoutes.indexOf(request.uri) !== -1) {
            request.uri = '/index.html';
          }
          return request;
        }
  StaticBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          -
            ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          -
            ObjectOwnership: "BucketOwnerEnforced"
      VersioningConfiguration:
        Status: "Enabled"
      Tags:
        -
          Key: "Project"
          Value: "MoodFit"
        -
          Key: "Environment"
          Value:
            Ref: "Environment"
        -
          Key: "Owner"
          Value:
            Ref: "Owner"
    DeletionPolicy: "Retain"
    UpdateReplacePolicy: "Retain"
  OriginAccessControl:
    Type: "AWS::CloudFront::OriginAccessControl"
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: "${AWS::StackName}-oac"
        OriginAccessControlOriginType: "s3"
        SigningBehavior: "always"
        SigningProtocol: "sigv4"
  Distribution:
    Type: "AWS::CloudFront::Distribution"
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          -
            Ref: "ViewerHostname"
        DefaultRootObject: "index.html"
        HttpVersion: "http2and3"
        IPV6Enabled: true
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 414, ErrorCachingMinTTL: 0}
          - {ErrorCode: 416, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 501, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
        Origins:
          -
            Id: "static"
            DomainName:
              Fn::GetAtt:
                - "StaticBucket"
                - "RegionalDomainName"
            OriginAccessControlId:
              Ref: "OriginAccessControl"
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: "api"
            DomainName: !Ref OriginHostname
            OriginCustomHeaders:
              - HeaderName: "X-MoodFit-Origin"
                HeaderValue: !Ref OriginVerificationValue
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: "https-only"
              OriginSSLProtocols: ["TLSv1.2"]
        CacheBehaviors:
          - PathPattern: "/api"
            TargetOriginId: "api"
            ViewerProtocolPolicy: "https-only"
            AllowedMethods: ["GET", "HEAD", "OPTIONS", "PUT", "PATCH", "POST", "DELETE"]
            CachedMethods: ["GET", "HEAD"]
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: "/api/*"
            TargetOriginId: "api"
            ViewerProtocolPolicy: "https-only"
            AllowedMethods: ["GET", "HEAD", "OPTIONS", "PUT", "PATCH", "POST", "DELETE"]
            CachedMethods: ["GET", "HEAD"]
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        DefaultCacheBehavior:
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouting.FunctionARN
          TargetOriginId: "static"
          ViewerProtocolPolicy: "redirect-to-https"
          AllowedMethods:
            - "GET"
            - "HEAD"
            - "OPTIONS"
          CachedMethods:
            - "GET"
            - "HEAD"
          Compress: true
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
        ViewerCertificate:
          AcmCertificateArn:
            Ref: "ViewerCertificateArn"
          SslSupportMethod: "sni-only"
          MinimumProtocolVersion: "TLSv1.2_2021"
      Tags:
        -
          Key: "Project"
          Value: "MoodFit"
        -
          Key: "Environment"
          Value:
            Ref: "Environment"
        -
          Key: "Owner"
          Value:
            Ref: "Owner"
  StaticBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    Properties:
      Bucket:
        Ref: "StaticBucket"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "cloudfront.amazonaws.com"
            Action: "s3:GetObject"
            Resource:
              Fn::Sub: "${StaticBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn:
                  Fn::Sub: "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          -
            Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource:
              -
                Fn::GetAtt:
                  - "StaticBucket"
                  - "Arn"
              -
                Fn::Sub: "${StaticBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  ApiOriginRequestPolicy:
    Type: "AWS::CloudFront::OriginRequestPolicy"
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api"
        Comment: "Forward request values except viewer Host; TLS uses the origin hostname"
        CookiesConfig: {CookieBehavior: "all"}
        QueryStringsConfig: {QueryStringBehavior: "all"}
        HeadersConfig:
          HeaderBehavior: "allExcept"
          Headers: ["Host"]
  ViewerIpv6Dns:
    Type: "AWS::Route53::RecordSet"
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ViewerHostname
      Type: "AAAA"
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: "Z2FDTNDATAQYW2"
        EvaluateTargetHealth: false
  ViewerDns:
    Type: "AWS::Route53::RecordSet"
    Properties:
      HostedZoneId:
        Ref: "HostedZoneId"
      Name:
        Ref: "ViewerHostname"
      Type: "A"
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - "Distribution"
            - "DomainName"
        HostedZoneId: "Z2FDTNDATAQYW2"
        EvaluateTargetHealth: false
Outputs:
  StaticBucketArn:
    Value:
      Fn::GetAtt:
        - "StaticBucket"
        - "Arn"
  StaticObjectArn:
    Value:
      Fn::Sub: "${StaticBucket.Arn}/*"
  DistributionArn:
    Value:
      Fn::Sub: "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
