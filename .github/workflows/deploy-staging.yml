name: deploy-staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA to deploy or restore
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: moodfit-staging-deployment
  cancel-in-progress: false

jobs:
  classify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/ci.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.classify.outputs.should_deploy }}
    steps:
      - name: Checkout history for automatic classification
        if: github.event_name == 'workflow_run'
        id: history
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Classify deployment commit
        id: classify
        env:
          REQUESTED_SHA: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess

          sha = os.environ['REQUESTED_SHA']
          if not re.fullmatch(r'[a-fA-F0-9]{40}', sha):
              raise SystemExit('Invalid full commit SHA')
          sha = sha.lower()
          should_deploy = True
          paths = []
          reason = 'Manual deployment; classification bypassed'
          if os.environ['EVENT_NAME'] == 'workflow_run':
              reason = 'Classification unavailable or empty; deploy by default'
              if os.environ['HISTORY_OUTCOME'] == 'success':
                  try:
                      result = subprocess.run(
                          ['git', 'diff', '--no-renames', '--name-only', '-z', sha + '^', sha, '--'],
                          check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      raw = result.stdout
                      if raw and not raw.endswith(b'\0'):
                          raise ValueError('Incomplete path list')
                      paths = raw[:-1].split(b'\0') if raw else []
                      if paths and all(paths):
                          docs_only = all(
                              p.startswith((b'docs/', b'prompts/', b'harness/tasks/')) or p.endswith(b'.md')
                              for p in paths)
                          should_deploy = not docs_only
                          reason = '문서만 변경되어 배포를 건너뜀' if docs_only else 'Code changes; deploy'
                  except (OSError, subprocess.CalledProcessError, ValueError):
                      paths = []
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('should_deploy=' + str(should_deploy).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Staging deployment classification\n\n' + reason + '\n\n')
              summary.write('Commit: `' + sha + '`\n\nChanged files: ' + str(len(paths)) + '\n\n')
              for path in paths[:20]:
                  safe = html.escape(json.dumps(path.decode('utf-8', errors='backslashreplace'), ensure_ascii=True))
                  summary.write('<pre>' + safe + '</pre>\n')
              if len(paths) > 20:
                  summary.write('\nOnly the first 20 paths are shown.\n')
          PY

  deploy:
    needs: classify
    if: needs.classify.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: staging
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: ap-northeast-2
      AWS_PAGER: ''
      AWS_CLI_AUTO_PROMPT: 'off'
      AWS_MAX_ATTEMPTS: '1'
      AWS_RETRY_MODE: standard
      ECS_CLUSTER: moodfit-staging
      ECS_SERVICE: moodfit-staging-backend
      ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}
      STATIC_BUCKET_NAME: ${{ secrets.STATIC_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout main history
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and checkout deployment commit
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Invalid full commit SHA'; exit 1; }
          sha=${REQUESTED_SHA,,}
          [[ "$(git rev-parse "$sha^{commit}")" == "$sha" ]]
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          [[ "$(git rev-parse HEAD)" == "$sha" ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Test backend and build bootJar
        id: backend
        working-directory: backend
        run: |
          set -euo pipefail
          bash ./gradlew test bootJar

      - name: Build linux amd64 image
        id: image_build
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg "VCS_REF=$DEPLOY_SHA" \
            -t "moodfit-staging-build:sha-$DEPLOY_SHA" backend

      - name: Obtain staging OIDC session
        id: oidc
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-duration-seconds: 3600
          role-session-name: moodfit-staging-${{ github.run_id }}
          mask-aws-account-id: true
          disable-retry: true

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Reuse immutable tag or push image
        id: image
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$ECR_REPOSITORY_URI" =~ ^[0-9]{12}\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/[a-z0-9._/-]+$ ]]
          repo=${ECR_REPOSITORY_URI#*/}
          tag="sha-$DEPLOY_SHA"
          error_file="$RUNNER_TEMP/ecr-error"
          if digest=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$tag" \
              --query 'imageDetails[0].imageDigest' --output text 2>"$error_file"); then
            echo 'Using existing immutable image'
          elif grep -q '(ImageNotFoundException)' "$error_file"; then
            docker tag "moodfit-staging-build:$tag" "$ECR_REPOSITORY_URI:$tag"
            docker push "$ECR_REPOSITORY_URI:$tag" >"$RUNNER_TEMP/image-push-log" 2>&1 || { echo 'Image push failed'; exit 1; }
            digest=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$tag" \
              --query 'imageDetails[0].imageDigest' --output text 2>"$error_file") || { echo 'Image lookup failed'; exit 1; }
          else
            echo 'Image lookup failed; no retry'
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Register image revision and update ECS service
        id: ecs_update
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          call() { aws "$@" 2>"$RUNNER_TEMP/aws-error"; }
          call ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" > "$RUNNER_TEMP/service-before.json"
          previous=$(python - "$RUNNER_TEMP/service-before.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert not d.get('failures') and len(d['services']) == 1
          s = d['services'][0]
          assert s['status'] == 'ACTIVE' and len(s['deployments']) == 1
          assert s['deployments'][0]['rolloutState'] == 'COMPLETED'
          assert s['runningCount'] == s['desiredCount'] and s['pendingCount'] == 0
          print(s['taskDefinition'])
          PY
          )
          call ecs describe-task-definition --task-definition "$previous" > "$RUNNER_TEMP/task-current.json"
          python - "$RUNNER_TEMP/task-current.json" "$RUNNER_TEMP/task-new.json" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))['taskDefinition']
          assert d['family'] == 'moodfit-staging-backend'
          for key in ('taskDefinitionArn', 'revision', 'status', 'requiresAttributes',
                      'compatibilities', 'registeredAt', 'registeredBy', 'deregisteredAt'):
              d.pop(key, None)
          containers = [c for c in d['containerDefinitions'] if c['name'] == 'backend']
          assert len(containers) == 1
          containers[0]['image'] = os.environ['ECR_REPOSITORY_URI'] + '@' + os.environ['IMAGE_DIGEST']
          d['tags'] = [{'key': 'MoodFitEnvironment', 'value': 'staging'}]
          with open(sys.argv[2], 'w') as f: json.dump(d, f)
          PY
          call ecs register-task-definition --cli-input-json "file://$RUNNER_TEMP/task-new.json" > "$RUNNER_TEMP/task-registered.json"
          target=$(python - "$RUNNER_TEMP/task-registered.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))['taskDefinition']
          assert d['family'] == 'moodfit-staging-backend'
          print(d['taskDefinitionArn'])
          PY
          )
          revision=${target##*:}
          [[ "$revision" =~ ^[0-9]+$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf '%s' "$target" > "$RUNNER_TEMP/target-task"
          call ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$target" > /dev/null

      - name: Wait for ECS and reject circuit breaker rollback
        id: ecs_wait
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" 2>"$RUNNER_TEMP/aws-error" || { echo 'ECS stability wait failed'; exit 1; }
          python - "$RUNNER_TEMP/target-task" <<'PY'
          import json, os, pathlib, subprocess, sys, time
          target = pathlib.Path(sys.argv[1]).read_text()
          deadline = time.monotonic() + 600
          reason = 'target deployment not ready'
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  sys.exit('ECS rollout timeout: ' + reason)
              try:
                  result = subprocess.run(
                      ['aws', 'ecs', 'describe-services', '--cluster', os.environ['ECS_CLUSTER'],
                       '--services', os.environ['ECS_SERVICE'], '--output', 'json'],
                      capture_output=True, text=True, timeout=min(30, remaining))
                  if result.returncode != 0:
                      sys.exit('ECS service lookup failed')
                  d = json.loads(result.stdout)
              except subprocess.TimeoutExpired:
                  sys.exit('ECS service lookup timed out')
              except (OSError, ValueError):
                  sys.exit('ECS service lookup unavailable or invalid')
              if d.get('failures') or len(d.get('services', [])) != 1:
                  sys.exit('ECS service lookup did not return one service')
              s = d['services'][0]
              if s.get('taskDefinition') != target:
                  sys.exit('ECS rolled back instead of deploying target')
              deployments = s.get('deployments', [])
              targets = [item for item in deployments if item.get('taskDefinition') == target]
              if any(item.get('rolloutState') == 'FAILED' for item in targets):
                  sys.exit('ECS target rollout FAILED')
              state = targets[0].get('rolloutState') if len(targets) == 1 else None
              safe_state = state if state in ('IN_PROGRESS', 'COMPLETED', 'FAILED') else 'UNKNOWN'
              if len(deployments) != 1 or len(targets) != 1:
                  reason = 'waiting for one target deployment'
              elif state != 'COMPLETED':
                  reason = 'rollout state ' + safe_state
              elif (s.get('desiredCount'), s.get('runningCount'), s.get('pendingCount')) != (2, 2, 0):
                  reason = 'desired/running/pending counts not ready'
              else:
                  print('ECS target rollout COMPLETED')
                  break
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  sys.exit('ECS rollout timeout: ' + reason)
              time.sleep(min(15, remaining))
          PY

      - name: Install test and build frontend
        id: frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - name: Publish assets before HTML without deletion
        id: publish
        run: |
          set -euo pipefail
          [[ -n "$STATIC_BUCKET_NAME" ]]
          aws s3 sync frontend/dist/ "s3://$STATIC_BUCKET_NAME/" --exclude '*.html' \
            --cache-control 'public,max-age=31536000,immutable' >"$RUNNER_TEMP/upload-log" 2>&1
          aws s3 cp frontend/dist/ "s3://$STATIC_BUCKET_NAME/" --recursive --exclude '*' --include '*.html' \
            --cache-control 'no-cache' --content-type text/html >"$RUNNER_TEMP/html-log" 2>&1

      - name: Invalidate CloudFront and wait for completion
        id: invalidate
        run: |
          set -euo pipefail
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text 2>"$RUNNER_TEMP/aws-error")
          [[ "$invalidation" =~ ^[A-Za-z0-9]+$ ]]
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation" 2>"$RUNNER_TEMP/aws-error"

      - name: Smoke test staging
        id: smoke
        run: |
          set -euo pipefail
          bash scripts/staging-smoke.sh

      - name: Write deployment summary
        if: always()
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          TASK_REVISION: ${{ steps.ecs_update.outputs.revision }}
          DEPLOY_RESULT: ${{ job.status }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          STEP_RESULTS: >-
            {"checkout":"${{ steps.checkout.outcome }}","target":"${{ steps.target.outcome }}",
            "java":"${{ steps.java.outcome }}","node":"${{ steps.node.outcome }}",
            "backend":"${{ steps.backend.outcome }}","image_build":"${{ steps.image_build.outcome }}",
            "oidc":"${{ steps.oidc.outcome }}","ecr_login":"${{ steps.ecr_login.outcome }}",
            "image":"${{ steps.image.outcome }}","ecs_update":"${{ steps.ecs_update.outcome }}",
            "ecs_wait":"${{ steps.ecs_wait.outcome }}","frontend":"${{ steps.frontend.outcome }}",
            "publish":"${{ steps.publish.outcome }}","invalidate":"${{ steps.invalidate.outcome }}",
            "smoke":"${{ steps.smoke.outcome }}"}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          steps = json.loads(os.environ['STEP_RESULTS'])
          failed = [name for name, result in steps.items() if result in ('failure', 'cancelled')]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Staging deployment\n\n')
              for label, key in [('Commit', 'DEPLOY_SHA'), ('Image digest', 'IMAGE_DIGEST'),
                                 ('Task revision', 'TASK_REVISION'), ('Deployment', 'DEPLOY_RESULT'), ('Smoke', 'SMOKE_RESULT')]:
                  f.write(f"- {label}: {os.environ.get(key) or 'not available'}\n")
              f.write('- Failed step: ' + (', '.join(failed) or 'none') + '\n')
          PY

      - name: Remove private temporary deployment files
        if: always()
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/ecr-error" "$RUNNER_TEMP/aws-error" "$RUNNER_TEMP/image-push-log" \
            "$RUNNER_TEMP/service-before.json" "$RUNNER_TEMP/service-after.json" "$RUNNER_TEMP/task-current.json" \
            "$RUNNER_TEMP/task-new.json" "$RUNNER_TEMP/task-registered.json" "$RUNNER_TEMP/target-task" \
            "$RUNNER_TEMP/upload-log" "$RUNNER_TEMP/html-log"
