name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        id: test
        run: npm test
        working-directory: frontend

      - name: Build frontend
        id: build
        run: npm run build
        working-directory: frontend

      # DEC-021: 실패한 경우에도 결과를 기록하고, Job의 성공 / 실패 판정은 바꾸지 않는다.
      - name: Write frontend summary
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          label() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "⏹️ cancelled" ;;
              *) echo "– not run" ;;
            esac
          }
          {
            echo "## Frontend"
            task_id=$(printf '%s' "$HEAD_REF" | sed -nE 's@^task/(TASK-[0-9]{3})-[a-z0-9-]+$@\1@p')
            printf 'Task: %s\nPR: %s\nHead SHA: %s\n' "${task_id:-none}" "$PR_URL" "$HEAD_SHA"
            echo "- Review Verdict: local Harness audit referenced in PR body; CI does not run AI Review."
            echo ""
            echo "| Step | Command | Result |"
            echo "|---|---|---|"
            echo "| Install | \`npm ci\` | $(label "$INSTALL_OUTCOME") |"
            echo "| Test | \`npm test\` | $(label "$TEST_OUTCOME") |"
            echo "| Build | \`npm run build\` | $(label "$BUILD_OUTCOME") |"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- MySQL Service Container: 사용하지 않음 (DEC-009)"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Run backend tests
        id: test
        run: ./gradlew test
        working-directory: backend

      - name: Build backend
        id: build
        run: ./gradlew build
        working-directory: backend

      # DEC-021: 실패한 경우에도 결과를 기록하고, Job의 성공 / 실패 판정은 바꾸지 않는다.
      - name: Write backend summary
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          label() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "⏹️ cancelled" ;;
              *) echo "– not run" ;;
            esac
          }
          {
            echo "## Backend"
            task_id=$(printf '%s' "$HEAD_REF" | sed -nE 's@^task/(TASK-[0-9]{3})-[a-z0-9-]+$@\1@p')
            printf 'Task: %s\nPR: %s\nHead SHA: %s\n' "${task_id:-none}" "$PR_URL" "$HEAD_SHA"
            echo "- Review Verdict: local Harness audit referenced in PR body; CI does not run AI Review."
            echo ""
            echo "| Step | Command | Result |"
            echo "|---|---|---|"
            echo "| Test | \`./gradlew test\` | $(label "$TEST_OUTCOME") |"
            echo "| Build | \`./gradlew build\` | $(label "$BUILD_OUTCOME") |"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- MySQL: Testcontainers (\`mysql:8.0.46\`, DEC-023)"
          } >> "$GITHUB_STEP_SUMMARY"
