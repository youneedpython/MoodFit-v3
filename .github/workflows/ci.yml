name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import re
          import subprocess

          def classify(paths):
              if not paths:
                  return True, True
              frontend = backend = False
              for path in paths:
                  if path.startswith('frontend/'):
                      frontend = True
                  elif path.startswith('backend/'):
                      backend = True
                  elif path.startswith(('contracts/', '.github/', 'scripts/', 'harness/')) or path in ('package.json', 'package-lock.json', '.nvmrc'):
                      frontend = backend = True
                  elif path.startswith(('docs/', 'prompts/', 'infra/')) or ('/' not in path and path.endswith('.md')):
                      continue
                  else:
                      frontend = backend = True
              return frontend, backend

          cases = [
              (['frontend/src/app.css'], (True, False)),
              (['backend/src/App.java'], (False, True)),
              (['contracts/api.json'], (True, True)),
              *[([p], (True, True)) for p in ('.github/workflows/ci.yml', 'scripts/verify.sh', 'harness/run.mjs', 'package.json', 'package-lock.json', '.nvmrc')],
              *[([p], (False, False)) for p in ('docs/spec.md', 'prompts/task.md', 'README.md', 'AGENTS.md', 'infra/template.yml')],
              (['unknown/file', 'docs/spec.md'], (True, True)),
              (['frontend/a', 'backend/b', 'docs/spec.md'], (True, True)),
              (['frontend/a', 'infra/template.yml'], (True, False)),
              (['backend/b', 'README.md'], (False, True)),
              (['docs/a', 'prompts/b', 'infra/c', 'README.md'], (False, False)),
              (['nested/readme.md'], (True, True)),
              ([], (True, True)),
          ]
          for paths, expected in cases:
              assert classify(paths) == expected, 'path classification self-check failed'
          if os.environ.get('CI_PATH_FILTER_SELF_TEST_ONLY') == '1':
              print('path classification self-check passed')
              raise SystemExit(0)

          event = os.environ.get('EVENT_NAME', '')
          base = os.environ.get('BASE_SHA', '')
          head = os.environ.get('HEAD_SHA', '')
          paths = []
          frontend = backend = True
          comparison = 'unavailable'
          reason = 'Safe default: unsupported event or missing/invalid SHA'
          valid = lambda sha: re.fullmatch(r'[0-9a-fA-F]{40}', sha) is not None and set(sha) != {'0'}
          if event in ('push', 'pull_request') and valid(base) and valid(head):
              comparison = base + ('...' if event == 'pull_request' else '..') + head
              try:
                  result = subprocess.run(['git', 'diff', '--no-renames', '--name-only', '-z', comparison, '--'], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  paths = [os.fsdecode(p) for p in result.stdout.split(b'\0') if p]
                  frontend, backend = classify(paths)
                  reason = 'Union of changed path rules' if paths else 'Safe default: empty path list'
              except (OSError, subprocess.CalledProcessError):
                  reason = 'Safe default: git diff failed'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'frontend={str(frontend).lower()}\nbackend={str(backend).lower()}\n')
          def escape(value):
              # HTML entities also neutralize Markdown and embedded line breaks.
              return ''.join(html.escape(c, quote=True) if c.isalnum() or c in ' /.-' else f'&#{ord(c)};' for c in value)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'## CI path filter\n\nComparison: {escape(comparison)}\n\nChanged paths: {len(paths)}\n\n')
              summary.write(f'- frontend: {str(frontend).lower()}\n- backend: {str(backend).lower()}\n- Reason: {escape(reason)}\n\n')
              for path in paths[:20]:
                  summary.write(f'- {escape(path)}\n')
              if len(paths) > 20:
                  summary.write(f'- 외 {len(paths) - 20}개\n')
          PY

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        id: test
        run: npm test
        working-directory: frontend

      - name: Build frontend
        id: build
        run: npm run build
        working-directory: frontend

      # DEC-021: 실패한 경우에도 결과를 기록하고, Job의 성공 / 실패 판정은 바꾸지 않는다.
      - name: Write frontend summary
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          label() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "⏹️ cancelled" ;;
              *) echo "– not run" ;;
            esac
          }
          {
            echo "## Frontend"
            task_id=$(printf '%s' "$HEAD_REF" | sed -nE 's@^task/(TASK-[0-9]{3})-[a-z0-9-]+$@\1@p')
            printf 'Task: %s\nPR: %s\nHead SHA: %s\n' "${task_id:-none}" "$PR_URL" "$HEAD_SHA"
            echo "- Review Verdict: local Harness audit referenced in PR body; CI does not run AI Review."
            echo ""
            echo "| Step | Command | Result |"
            echo "|---|---|---|"
            echo "| Install | \`npm ci\` | $(label "$INSTALL_OUTCOME") |"
            echo "| Test | \`npm test\` | $(label "$TEST_OUTCOME") |"
            echo "| Build | \`npm run build\` | $(label "$BUILD_OUTCOME") |"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- MySQL Service Container: 사용하지 않음 (DEC-009)"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Run backend tests
        id: test
        run: ./gradlew test
        working-directory: backend

      - name: Build backend
        id: build
        run: ./gradlew build
        working-directory: backend

      # DEC-021: 실패한 경우에도 결과를 기록하고, Job의 성공 / 실패 판정은 바꾸지 않는다.
      - name: Write backend summary
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          label() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "⏹️ cancelled" ;;
              *) echo "– not run" ;;
            esac
          }
          {
            echo "## Backend"
            task_id=$(printf '%s' "$HEAD_REF" | sed -nE 's@^task/(TASK-[0-9]{3})-[a-z0-9-]+$@\1@p')
            printf 'Task: %s\nPR: %s\nHead SHA: %s\n' "${task_id:-none}" "$PR_URL" "$HEAD_SHA"
            echo "- Review Verdict: local Harness audit referenced in PR body; CI does not run AI Review."
            echo ""
            echo "| Step | Command | Result |"
            echo "|---|---|---|"
            echo "| Test | \`./gradlew test\` | $(label "$TEST_OUTCOME") |"
            echo "| Build | \`./gradlew build\` | $(label "$BUILD_OUTCOME") |"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- MySQL: Testcontainers (\`mysql:8.4.11\`, DEC-023 / DEC-030)"
          } >> "$GITHUB_STEP_SUMMARY"
